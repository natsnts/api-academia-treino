name: CI - Commit

# Dispara a cada push (evento de commit) em qualquer branch do repositório.
on:
  push:
    branches:
      - "**"

jobs:
  qualidade:
    name: Qualidade (testes, cobertura e linter)
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório (checkout da branch do commit)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}

      - name: Instalar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Instalar dependências
        # --only-binary=:all: evita instalar a partir de pacotes-fonte
        # (sdist), que podem rodar scripts arbitrários de instalação
        run: pip install --only-binary=:all: -r requirements.txt

      - name: Rodar linter (flake8)
        run: flake8 .

      - name: Rodar testes e verificar cobertura (mínimo 90%)
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=90
