name: SonarCloud

# Roda a análise estática a cada push na main e a cada Pull Request,
# para que o relatório do SonarCloud sempre reflita o código mais recente.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  sonarcloud:
    name: Análise estática (SonarCloud)
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # necessário para o SonarCloud analisar o histórico de commits
          # corretamente (ex.: código "novo" vs. código já existente)
          fetch-depth: 0

      - name: Instalar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Instalar dependências
        # --only-binary=:all: evita instalar a partir de pacotes-fonte
        # (sdist), que podem rodar scripts arbitrários de instalação
        run: pip install --only-binary=:all: -r requirements.txt

      - name: Rodar testes e gerar relatório de cobertura
        run: pytest --cov=app --cov-report=xml

      # ATENÇÃO (ver README/PROTECAO_DE_BRANCHES): troque "@master" abaixo
      # pelo commit SHA exato mostrado na página de Releases do repositório
      # SonarSource/sonarcloud-github-action no GitHub, para não depender
      # de uma branch mutável. Ex.: @<sha-completo> # v5.0.0
      - name: Rodar análise do SonarCloud
        uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8 # v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
