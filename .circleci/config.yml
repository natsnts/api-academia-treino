version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout

      - run:
          name: Instalar dependências
          command: |
            pip install -r requirements.txt
            pip install pytest

      - run:
          name: Rodar testes automatizados
          command: pytest -v --junitxml=test-results/junit.xml

      - store_test_results:
          path: test-results

  # Constrói a imagem Docker (roda em TODAS as branches)
  build-image:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - setup_remote_docker
      - run:
          name: Construir imagem Docker
          command: docker build -t api-academia-treino:${CIRCLE_SHA1} .

workflows:
  build_and_test:
    jobs:
      - test
      - build-image:
          requires:
            - test