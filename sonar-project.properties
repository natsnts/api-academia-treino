# Configuração do SonarCloud (versão gratuita e em nuvem do SonarQube)
#
# IMPORTANTE: troque os valores de sonar.projectKey e sonar.organization
# pelos valores exatos que o SonarCloud mostrar para você ao importar o
# repositório (eles aparecem na tela de criação do projeto).

sonar.projectKey=natsnts_api-academia-treino
sonar.organization=natsnts

# Nome amigável exibido no dashboard
sonar.projectName=API Academia Treino

# Pasta raiz onde está o código-fonte
sonar.sources=.

# Pastas e arquivos que não devem ser analisados
sonar.exclusions=venv/**,.venv/**,**/__pycache__/**,**/*.pyc

# Pasta de testes (separada dos fontes para fins de relatório)
sonar.tests=tests

# Relatório de cobertura gerado pelo pytest-cov, usado pelo SonarCloud
# para mostrar a cobertura de código ao lado dos apontamentos
sonar.python.coverage.reportPaths=coverage.xml

# Versão do Python usada no projeto
sonar.python.version=3.11
