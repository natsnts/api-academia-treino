name: CI/CD Pipeline

on:
  push:
    branches:
      - "**" # Executa em qualquer mudança de qualquer branch

jobs:
  # Job 1: Testes (Opcional, mas recomendado para fechar 3 jobs de qualidade)
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10" # Ajuste para a versão do seu projeto
      - name: Install dependencies and test
        run: |
          pip install -r requirements.txt
          pytest

  # Job 2: Construção da Imagem (Roda em todas as branches)
  build-image:
    name: Build Docker Image
    needs: test # Só constrói se os testes passarem
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        # Apenas constrói a imagem localmente para garantir que o Dockerfile está correto
        run: docker build -t api-academia-treino:test .

  # Job 3: Publicação no DockerHub (Roda APENAS na branch principal)
  publish-image:
    name: Publish to DockerHub
    needs: build-image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' # Substitua 'main' por 'master' se for o caso
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/api-academia-treino:latest
